service: checkout-service
tenant: team-retail
window_seconds: 30

thresholds:
  error_rate: 0.05
  latency_ms: 500

actions:
  on_error: ROLLBACK
  on_latency: PAUSE
  on_success: PROMOTE

slo:
  enabled: false
  min_events: 50
  availability_target: 0.99
  latency_p95_ms: 400
  on_breach: ROLLBACK

adaptive:
  enabled: true
  min_events: 50
  alpha: 0.25
  error_rate_multiplier: 1.4
  latency_multiplier: 1.3
  error_rate_min: 0.02
  error_rate_max: 0.10
  latency_min_ms: 250
  latency_max_ms: 700
